[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumenc"
version = "0.1.0"
description = "lumenc: a compiler from a small statically typed language (Lumen) to LLVM IR"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "iamsandeshdhital"}]
keywords = ["compiler", "llvm", "llvm-ir", "interpreter", "type-checking", "ast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.scripts]
lumenc = "lumen.driver:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]